[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "securities-voice-assistant"
version = "0.1.0"
description = "全地端證券知識型語音客服安全基礎"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "services/orchestrator/src/orchestrator",
  "packages/answer_contract/src/answer_contract",
  "packages/observability/src/observability",
  "packages/policy/src/policy",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "services/orchestrator/src",
  "packages/answer_contract/src",
  "packages/observability/src",
  "packages/policy/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "services/orchestrator/src",
  "packages/answer_contract/src",
  "packages/observability/src",
  "packages/policy/src",
  "tests",
]

